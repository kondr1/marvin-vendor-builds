name: hostapd

on:
  push:
    branches: [main]
    # A tag publishes a release: the intake in marvin-components pulls the
    # artifact from there, not from the run artifacts — those expire after a
    # limited retention period and cannot be downloaded across repositories
    # without a token.
    tags: ["hostapd-v*"]
    paths:
      - hostapd/**
      - scripts/**
      - container.digest
      - .github/workflows/hostapd.yml
  pull_request:
    paths:
      - hostapd/**
      - scripts/**
      - container.digest
  workflow_dispatch:

# The commit that updates container.digest is made by the "container" workflow
# using GITHUB_TOKEN, and such pushes do not trigger other workflows. After a
# digest bump, start the build manually: gh workflow run hostapd.yml

concurrency:
  group: hostapd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publishing a release on a tag
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Artifact cache layer: the key is derived from ALL build inputs. On a
      # hit there is nothing to build, the artifact is reused as is (ADR-0020).
      - id: inputs
        run: |
          key=$(cat Dockerfile container.digest hostapd/* scripts/* 2>/dev/null |
                sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - id: artifact
        uses: actions/cache@v4
        with:
          path: out
          key: hostapd-artifact-${{ steps.inputs.outputs.key }}

      # Downloads are immutable: a tarball with the same checksum never changes.
      - if: steps.artifact.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: downloads
          key: hostapd-src-${{ hashFiles('hostapd/*.sha256') }}
          restore-keys: hostapd-src-

      # Compiler cache. Deliberately kept narrow: it must not evict the
      # artifact layer, which saves far more.
      - if: steps.artifact.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/zig
          key: zig-${{ hashFiles('container.digest') }}-${{ steps.inputs.outputs.key }}
          restore-keys: zig-${{ hashFiles('container.digest') }}-

      - if: steps.artifact.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.artifact.outputs.cache-hit != 'true'
        run: |
          image=$(cat container.digest)
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -v "$HOME/.cache/zig:/root/.cache/zig" \
            -e BUILD_CONTAINER_DIGEST="$image" \
            "$image" bash scripts/build-hostapd.sh

      # Verification always runs, including on a cache hit: the cache makes
      # things faster but proves nothing (ADR-0020).
      - name: Verify artifact
        run: |
          scripts/verify-artifact.sh out/hostapd aarch64
          cd out && sha256sum -c hostapd.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hostapd-aarch64-static
          path: |
            out/hostapd
            out/hostapd.sha256
            out/build-info.yaml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            out/hostapd out/hostapd.sha256 out/build-info.yaml \
            --title "hostapd ${GITHUB_REF_NAME}" \
            --notes "Static aarch64 binary. Contents and checksums are in build-info.yaml."
