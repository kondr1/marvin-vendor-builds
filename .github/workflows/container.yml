name: container

# The build image is published separately from the artifacts and consumed by
# digest. Without this step a "pinned digest" degrades into latest within a
# couple of months.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/container.yml
  workflow_dispatch:

concurrency:
  group: container
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/build:latest

      # The digest is pinned in the repository: builds pull the image by it.
      - name: Record digest
        run: |
          echo "ghcr.io/${{ github.repository }}/build@${{ steps.push.outputs.digest }}" \
            > container.digest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add container.digest
          git diff --cached --quiet || git commit -m "chore: bump build container digest"
          git push
